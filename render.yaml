databases:
  - name: momentra-db
    plan: free
    databaseName: momentra
    user: momentra

services:
  - type: web
    name: momentra-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.server
    dockerContext: .
    disk:
      name: uploads
      mountPath: /app/server/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: momentra-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: BCRYPT_COST
        value: 12

  - type: web
    name: momentra-client
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.client
    dockerContext: .
