services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: momentra
      POSTGRES_PASSWORD: momentra
      POSTGRES_DB: momentra
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentra"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      DATABASE_URL: postgresql://momentra:momentra@db:5432/momentra
      CLIENT_ORIGIN: http://localhost:8080
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/server/uploads
    ports:
      - "3000:3000"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
  uploads:
